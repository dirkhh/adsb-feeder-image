services:
  radarvirtuel_STAGE2NUM:
    image: ${RV_CONTAINER}
    healthcheck:
      disable: true
    container_name: radarvirtuel_STAGE2NUM
    hostname: radarvirtuel_STAGE2NUM
    restart: unless-stopped
    networks:
      - adsb_im_bridge
    cpu_period: 50000
    cpu_quota: 7500
    stop_grace_period: 3s
    environment:
      - BEASTHOST=uf_STAGE2NUM
      - VERBOSE=OFF
      - ENABLE_MLAT=${MLAT_ENABLE_STAGE2NUM}
      - RV_CONTRIB_NAME=${MLAT_SITE_NAME_STAGE2NUM}
      - RV_CONTRIB_EMAIL=no@email.none
      - LAT=${FEEDER_LAT_STAGE2NUM}
      - LON=${FEEDER_LONG_STAGE2NUM}
      - ALT=${FEEDER_ALT_M_STAGE2NUM}
      - RV_STATION_UID=${ULTRAFEEDER_UUID_STAGE2NUM}
      - S6_KILL_GRACETIME=1000
      # USER_PROVIDED_ENV_START
      # USER_PROVIDED_ENV_END
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M
      - /run:exec,size=64M
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
