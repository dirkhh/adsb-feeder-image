services:
  opensky:
    image: ${OS_CONTAINER}
    healthcheck:
      disable: true
    container_name: opensky
    hostname: opensky
    restart: unless-stopped
    networks:
      - adsb_im_bridge
    cpu_period: 50000
    cpu_quota: 7500
    stop_grace_period: 3s
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - OPENSKY_USERNAME=${FEEDER_OPENSKY_USERNAME}
      - OPENSKY_SERIAL=${FEEDER_OPENSKY_SERIAL}
      - ENABLE_MLAT=${MLAT_ENABLE}
      - MLAT_PRIVACY=${MLAT_PRIVACY}
      - MLAT_RESULTS_BEASTHOST=ultrafeeder
      - MLAT_RESULTS_BEASTPORT=31004
      - S6_KILL_GRACETIME=1000
      # USER_PROVIDED_ENV_START
      # USER_PROVIDED_ENV_END
    volumes:
      - /run/adsb-feeder-opensky:/run
    tmpfs:
      - /var/log
