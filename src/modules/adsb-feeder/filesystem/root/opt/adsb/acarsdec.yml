services:
  acarsdec:
    image: ${ACARSDEC_CONTAINER}
    container_name: acarsdec
    hostname: acarsdec
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - adsb_im_bridge
    environment:
      # - QUIET_LOGS=true
      - TZ=${FEEDER_TZ}
      - SOAPYSDR=${ACARS_SDR_STRING}
      - RTL_SERIAL=${FEEDER_SERIAL_ACARS_RTL}
      - AIRSPY_SERIAL=${FEEDER_SERIAL_ACARS_AIRSPY}
      - BIASTEE=${ACARS_BIASTEE}
      - GAIN=${ACARS_GAIN}
      # the default frequencies are 'acarsdec has the the more common frequencies above 130MHz, acarsdec2 has the less common frequencies starting at 128.975MHz'
      - FREQUENCIES=${ACARS_FREQUENCIES:-130.025 130.450 131.125 131.450 131.475 131.525 131.550 131.725 130.425 130.825 130.850 131.200 131.075}
      - FEED_ID=${ACARS_FEED_ID}
      - OUTPUT_SERVER=acars_router
      # zmq, not tcp: acars-bridge's tcp/udp output pins the first resolved address, which is
      # IPv6 when the docker bridge has IPv6 enabled, while acars_router only listens on 0.0.0.0.
      # libzmq resolves IPv4 only and re-resolves on reconnect (same path dumpvdl2 already uses).
      - OUTPUT_SERVER_MODE=zmq
      - OUTPUT_SERVER_PORT=35550
      # USER_PROVIDED_ENV_START
      # USER_PROVIDED_ENV_END
    tmpfs:
      - /var/log:size=64M
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - /run/adsb-feeder-acars:/run
      - /dev/bus/usb:/dev/bus/usb:ro
